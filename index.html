<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#000;
}
.cover{
    width:100%;
    min-height:100vh;
    height:100dvh;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    background-image:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.45)),
        url("foto utama.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
.overlay{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.45),
        rgba(0,0,0,.15)
    );
}
.overlay>*{
    width:100%;
    text-align:center;
}
h1{
    color:#e8e65c;
    font-size:35px;
    font-weight:700;
    margin-bottom:15px;
    line-height:1.2;
}

.small{
    color:#fff;
    letter-spacing:5px;
    font-size:16px;
    margin-bottom:10px;
}

.guest{
    font-size:20px;
    font-weight:600;
    color:#fff;
    margin-bottom:30px;
    word-wrap:break-word;
}

button{
    margin-top:20px;
    width:280px;
    max-width:50%;
    padding:18px;
    background:#fff;
    border:none;
    border-radius:50px;
    font-size:20px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#e8e65c;
    color:#fff;
}

.music{
    position:absolute;
    top:20px;
    right:20px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2px;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}
/* Tablet */
@media (max-width:768px){
h1{
    margin-bottom:5px;
}

.small{
    margin-bottom:5px;
}

.guest{
    margin-bottom:15px;
}

button{
    margin-top:10px;
}
    .music{
        width:50px;
        height:50px;
        font-size:22px;
    }

}
@media (max-width:480px){
h1{
    margin-bottom:5px;
}

.small{
    margin-bottom:5px;
}

.guest{
    margin-bottom:15px;
}

button{
    margin-top:10px;
}
.music{
    top:15px;
    right:15px;
    width:45px;
    height:45px;
    font-size:20px;
}

}

/* HP kecil */
@media (max-width:360px){

    h1{
        font-size:20px;
    }

    .guest{
        font-size:20px;
    }

    button{
        width:200px;
        font-size:16px;
    }

}
</style>

<body>

<div class="cover">
<div class="music" id="musicBtn">
    🔊
</div>
<div class="overlay">

<h1>Rico & Icha</h1>

<div class="small">Dear :</div>

<div id="guest" class="guest"></div>

<button onclick="openInvitation()">
Buka Undangan
</button>

</div>

</div>
<audio id="music" loop>
    <source src="lagu.mp3" type="audio/mpeg">
</audio>
<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("guest").textContent =
params.get("to") || "Tamu Undangan";

function openInvitation() {
    // Putar musik
const music = document.getElementById("music");

music.play().catch(err=>{
    console.log(err);
});

    // Pindah ke halaman isi sambil membawa nama tamu
    window.location.href = "isi.html?" + params.toString();
}
</script>
</body>
